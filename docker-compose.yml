name: envforge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: envforge
      POSTGRES_PASSWORD: envforge
      POSTGRES_DB: envforge
    ports:
      - "5432:5432"
    volumes:
      - envforge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U envforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://envforge:envforge@postgres:5432/envforge
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "${API_HOST_PORT:-8010}:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No --reload: on this Colima/virtiofs setup, bind-mount file events
    # don't propagate reliably to the container's file watcher (confirmed:
    # both inotify and watchfiles' polling mode either miss changes or
    # make the initial scan effectively hang). Restart explicitly after
    # backend code changes with `make restart` instead.
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://envforge:envforge@postgres:5432/envforge
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      RUNNING_IN_DOCKER: "true"
      TERRAFORM_MODULE_ROOT: /infrastructure/terraform/environments/local
      KUBE_CONTEXT: kind-envforge
    volumes:
      - ./apps/api:/app
      - ./infrastructure:/infrastructure:ro
      - ~/.kube:/root/.kube:ro
    # Terraform (running inside this container) needs to reach the kind
    # cluster's API server, which the host's kubeconfig records as
    # 127.0.0.1 — inside a container that's the container itself, not the
    # Docker host. `host.docker.internal` is rewritten in for this reason;
    # see app.services.provisioning._effective_kubeconfig_path.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Runs the TTL/orphan/stale-job sweeps on their own schedule (see
  # app/workers/celery_app.py's beat_schedule). A separate process from
  # `worker` — beat only schedules tasks, it never runs them itself.
  beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://envforge:envforge@postgres:5432/envforge
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./apps/api:/app
    command: celery -A app.workers.celery_app beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/frontend
      # The dev stage (full node_modules + Vite's hot-reload dev server)
      # — not the default `production` target, which is a slim nginx
      # image with no dev tooling, built for CI's container-scan and for
      # an actual deployment, neither of which want a bind-mounted
      # hot-reload server.
      target: dev
    environment:
      VITE_API_BASE_URL: http://localhost:${API_HOST_PORT:-8010}
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus:/etc/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-9091}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    volumes:
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus

volumes:
  envforge_postgres_data:
