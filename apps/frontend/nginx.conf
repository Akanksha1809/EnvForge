server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA uses react-router's BrowserRouter (history mode) — any path
    # that isn't a real static file falls through to index.html so
    # client-side routing handles it, instead of nginx 404ing a refresh
    # on e.g. /environments/<id>.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
