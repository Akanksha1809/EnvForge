name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: apps/api

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: envforge
          POSTGRES_PASSWORD: envforge
          POSTGRES_DB: envforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U envforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv pip install -e . --group dev --system

      - name: Ruff lint
        run: ruff check app/ tests/

      - name: Ruff format check
        run: ruff format --check app/ tests/

      - name: mypy
        run: mypy app/

      - name: Run migrations against the service Postgres
        env:
          DATABASE_URL: postgresql+asyncpg://envforge:envforge@localhost:5432/envforge
        run: alembic upgrade head

      - name: pytest with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://envforge:envforge@localhost:5432/envforge
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
        run: pytest tests/ --cov=app --cov-report=term-missing
