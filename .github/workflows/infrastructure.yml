name: Infrastructure CI

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
      - ".github/workflows/infrastructure.yml"
  pull_request:
    paths:
      - "infrastructure/**"
      - ".github/workflows/infrastructure.yml"

jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - infrastructure/terraform/modules/environment-namespace
          - infrastructure/terraform/modules/environment-app
          - infrastructure/terraform/modules/environment-dependency
          - infrastructure/terraform/modules/aws-platform
          - infrastructure/terraform/environments/local
          - infrastructure/terraform/environments/aws
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt -check
        run: terraform fmt -check -recursive infrastructure/terraform

      - name: terraform init (no backend, no cloud credentials needed)
        working-directory: ${{ matrix.module }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: ${{ matrix.module }}
        run: terraform validate

# No Helm job: this project never adopted Helm. `ingress-nginx` installs
# from its own plain kubectl manifest (see `make kind-ingress`), and every
# other Kubernetes object EnvForge creates goes through the Terraform
# modules above — there was never a chart to lint, so no placeholder job
# is kept around pretending otherwise.
